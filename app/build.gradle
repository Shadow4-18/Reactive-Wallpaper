plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.reactivewallpaper'
    compileSdk = 35

    defaultConfig {
        applicationId = 'com.reactivewallpaper'
        minSdk = 26
        targetSdk = 35
        versionCode = 22
        versionName = '3.1'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Releases are signed with the private Resona key, which only the release
    // workflow has (from repository secrets). Without it, e.g. on a developer's
    // machine, builds use that machine's own debug key instead.
    def releaseKeystore = System.getenv('RESONA_KEYSTORE_FILE')
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile = file(releaseKeystore)
                storeType = 'pkcs12'
                storePassword = System.getenv('RESONA_KEYSTORE_PASSWORD')
                keyAlias = 'resona'
                keyPassword = System.getenv('RESONA_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig = releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    testOptions {
        // Plain JVM tests cover pure logic; Android calls there just return defaults.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // On-device subject detection for "Subject in front" (runs through Google Play services).
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'

    // Test-only libraries: none of these ship in the app.
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
