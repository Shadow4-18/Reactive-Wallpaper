name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (e.g. v1.0). Leave empty to only build.'
        required: false
        default: ''
      notes:
        description: "What's new in this release (shown in the app's update banner)."
        required: false
        default: ''
      test:
        description: 'Test build: publish as a pre-release, which the in-app updater never offers.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RESONA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/resona-release.p12"
            echo "RESONA_KEYSTORE_FILE=$RUNNER_TEMP/resona-release.p12" >> "$GITHUB_ENV"
          fi

      # Logic tests (beat detection, sync calibration, versions); a failure stops the release.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          RESONA_KEYSTORE_PASSWORD: ${{ secrets.RESONA_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # A release signed with anything but the Resona key couldn't update installed copies.
      - name: Require the release key for releases
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.version != '') && env.RESONA_KEYSTORE_FILE == ''
        run: |
          echo "::error::Add the RESONA_KEYSTORE_BASE64 and RESONA_KEYSTORE_PASSWORD repository secrets before publishing a release."
          exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Resona.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Resona-apk
          path: Resona.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Resona ${{ inputs.version || github.ref_name }}${{ inputs.test && ' (test build)' || '' }}
          prerelease: ${{ inputs.test == true }}
          # The app shows everything above the --- line as "what's new".
          body: |
            ${{ inputs.notes }}

            ---
            Download **Resona.apk** below on your Android phone, open it,
            and allow installing from unknown sources when asked. If you already
            have Resona, it can update itself from inside the app.
          files: Resona.apk

  # Runs the app on an Android emulator: renders every look to pictures, opens
  # each screen, and fails on any crash. Screenshots are uploaded as an artifact.
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build app and tests
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p device-output

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/device-tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: device-output/

      # The same results on one rolling pre-release, which is easy to download from
      # anywhere. Pre-releases are never "latest", so the in-app updater ignores it.
      - name: Zip results
        if: always()
        run: cd device-output && zip -qr ../device-results.zip .

      - name: Publish to the CI screenshots pre-release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-screenshots
          name: CI screenshots
          prerelease: true
          make_latest: false
          body: |
            Screenshots and logs from the latest emulator test run (not an app release).
            Updated automatically on every build.
          files: device-results.zip
          overwrite_files: true

  # The look gallery list (gallery/looks.json) on a rolling pre-release the app
  # downloads from. Pre-releases are never "latest", so the updater ignores it.
  gallery:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the gallery list
        run: |
          python3 - <<'PY'
          import json
          looks = json.load(open('gallery/looks.json'))['looks']
          assert looks, 'empty gallery'
          for look in looks:
              assert look['name'] and look['code'].startswith('resona://look/'), look
          print(len(looks), 'looks')
          PY

      - name: Publish the gallery list
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gallery
          name: Look gallery
          prerelease: true
          make_latest: false
          body: |
            The looks in Resona's look gallery (not an app release). Updated from
            gallery/looks.json on every push.
          files: gallery/looks.json
          overwrite_files: true

