name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (e.g. v1.0). Leave empty to only build.'
        required: false
        default: ''
      notes:
        description: "What's new in this release (shown in the app's update banner)."
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Resona.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Resona-apk
          path: Resona.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Resona ${{ inputs.version || github.ref_name }}
          # The app shows everything above the --- line as "what's new".
          body: |
            ${{ inputs.notes }}

            ---
            Download **Resona.apk** below on your Android phone, open it,
            and allow installing from unknown sources when asked. If you already
            have Resona, it can update itself from inside the app.
          files: Resona.apk
